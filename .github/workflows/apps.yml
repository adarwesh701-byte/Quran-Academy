name: Build app previews (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build Android debug APK
        working-directory: apps/android
        run: |
          npm install
          mkdir -p www
          cp ../../index.html www/index.html
          cp ../../index.html www/offline.html
          cp ../../sw.js ../../manifest.json www/
          cp -r ../../icons ../../qr www/
          npx cap add android
          cp ../desktop/icon.png /tmp/icon.png
          for d in android/app/src/main/res/mipmap-*dpi; do
            cp /tmp/icon.png "$d/ic_launcher.png"
            cp /tmp/icon.png "$d/ic_launcher_round.png"
            cp /tmp/icon.png "$d/ic_launcher_foreground.png" 2>/dev/null || true
          done
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />#' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/apps/itqan-academy-android-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/itqan-academy-android-debug.apk
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build desktop preview
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        shell: bash
        run: |
          mkdir -p site
          cp ../../index.html ../../sw.js ../../manifest.json site/
          cp -r ../../icons ../../qr site/
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: apps/desktop/dist/**
          if-no-files-found: error

  publish-preview:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-preview
          name: Itqan Academy — Preview Builds
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Manual preview builds for testing only. Android APK is a debug build; desktop packages are unsigned.
            Validate installation, offline behavior, microphone/camera permissions, and target OS behavior before distribution.
          files: release-assets/**/*
