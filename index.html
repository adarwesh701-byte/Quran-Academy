<style>

html{scroll-behavior:smooth}
body{margin:0;font-family:Tajawal,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--fg);line-height:1.65;min-height:100vh;display:flex;flex-direction:column}

p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;inset-inline-start:1rem;top:-4rem;background:var(--accent);color:var(--accent-fg);padding:.5rem 1rem;border-radius:10px;z-index:100;font-weight:700}

.wrap{width:100%;max-width:1120px;margin-inline:auto;padding-inline:1rem}
.muted{color:var(--muted)}

.gold{color:var(--gold)}

.sm{font-size:.85rem}
.xs{font-size:.75rem}

.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding-block:.7rem}
.logo{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.logo i{font-style:normal;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:1.2rem}
.logo b{display:block;color:var(--accent);font-size:.95rem;line-height:1.2}
.logo small{display:none;color:var(--muted);font-size:.7rem}
.nav{display:none;gap:.15rem}
.nav a{white-space:nowrap;padding:.45rem .6rem;border-radius:10px;text-decoration:none;font-weight:700;font-size:.88rem}
.nav a:hover,.nav a[aria-current=page]{color:var(--accent)}
.tools{display:flex;align-items:center;gap:.4rem}
.ibtn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:36px;padding-inline:.6rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit;font-size:.85rem;font-weight:700}
.ibtn:hover{border-color:var(--accent)}
select.ibtn{padding-inline:.4rem;color:var(--accent)}
.mnav{display:none;border-top:1px solid var(--line);background:var(--card)}
.mnav.open{display:block}
.mnav a{display:block;padding:.7rem .5rem;border-radius:10px;text-decoration:none;font-weight:700}
.mnav a:hover{background:var(--bg)}
.btn.hide-sm{display:none;white-space:nowrap}

@media(min-width:1180px){.nav{display:flex}.burger{display:none}.mnav{display:none!important}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:12px;padding:.65rem 1.25rem;font:inherit;font-weight:700;font-size:.92rem;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:.15s;text-align:center}
.btn:hover{opacity:.9}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--accent);color:var(--accent-fg)}
.btn-g{background:var(--gold);color:var(--gold-fg)}
.btn-o{background:var(--card);color:var(--fg);border-color:var(--line)}
.btn-o:hover{border-color:var(--accent);opacity:1}

main{flex:1;outline:none}
.sec{padding-block:3rem}
.sec-alt{background:var(--card);border-block:1px solid var(--line)}
.stitle{font-size:1.6rem;font-weight:800;margin-bottom:.5rem}
.ssub{color:var(--muted);max-width:42rem;margin-bottom:1.75rem}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.4rem}
.sec-alt .card{background:var(--bg)}
.card-h{display:flex;flex-direction:column;text-decoration:none;transition:.15s}
.card-h:hover{border-color:var(--accent)}
.card-h .more{margin-top:auto;padding-top:1rem;color:var(--accent);font-weight:700;font-size:.9rem}
.badge{display:inline-block;border-radius:999px;border:1px solid var(--line);padding:.15rem .7rem;font-size:.74rem;font-weight:700;color:var(--muted)}
.badge-a{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.badge-g{border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.notice{border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);background:color-mix(in srgb,var(--gold) 10%,transparent);color:var(--gold);border-radius:12px;padding:.7rem 1rem;font-size:.88rem;font-weight:700;margin-bottom:1.25rem}
.ok{border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}

.hero{background:linear-gradient(180deg,var(--card),var(--bg));border-bottom:1px solid var(--line)}
.hero .wrap{padding-block:3.5rem}
.hero h1{font-size:clamp(1.7rem,5vw,3rem);font-weight:800;margin-block:1rem;max-width:46rem}
.hero p.lead{font-size:1.05rem;color:var(--muted);max-width:40rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.checks li{display:flex;gap:.5rem}
.checks li:before{content:"✓";color:var(--accent);font-weight:800}
.checks{display:grid;gap:.45rem;font-size:.9rem;color:var(--muted)}
.big{font-size:2rem}

.copy{border-top:1px solid var(--line);text-align:center;padding:1rem;font-size:.78rem;color:var(--muted)}
.avatar{display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:1.15rem}

.crumb{font-size:.88rem;color:var(--muted);margin-bottom:1.25rem}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--accent)}
.sched li{display:flex;justify-content:space-between;gap:1rem;padding:.4rem 0;border-bottom:1px dashed var(--line);font-size:.9rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

let currentLang = localStorage.getItem('lang') || 'ar';

function t(key, vars = {}) {
  let keys = key.split('.');
  let val = I18N[currentLang];
  for (let k of keys) {
    if (val && val[k] !== undefined) val = val[k];
    else {
      val = I18N['ar'];
      for (let k2 of keys) { if (val) val = val[k2]; }
      break;
    }
  }
  if (typeof val !== 'string') return key;
  for (let v in vars) { val = val.replace(new RegExp(`\\{${v}\\}`, 'g'), vars[v]); }
  return val;
}

/* محرك ذكاء اصطناعي تفاعلي مع دعم التحويل البشري عند العجز */
function sendAIQuery() {
  const input = document.getElementById('aiInput');
  const body = document.getElementById('aiBody');
  const q = input.value.trim();
  if(!q) return;

  body.innerHTML += `<div class="ai-msg user">${escapeHtml(q)}</div>`;
  input.value = '';
  body.scrollTop = body.scrollHeight;

  setTimeout(() => {
    let ans = "";
    let lowQ = q.toLowerCase();
    
    if(lowQ.includes('سعر') || lowQ.includes('تكلفة') || lowQ.includes('price') || lowQ.includes('bazaar') || lowQ.includes('cost')) {
      ans = currentLang==='ar' ? 'تبدأ الباقات من 40$ شهرياً، وتتوفر حصة تجريبية للتعرف على مستواك. يمكنك زيارة صفحة الأسعار للتفاصيل.' : 'Packages start from $40/month, and a trial lesson is available. Check the pricing page for details.';
    } else if(lowQ.includes('حجز') || lowQ.includes('تجريبية') || lowQ.includes('book') || lowQ.includes('trial')) {
      ans = currentLang==='ar' ? 'يمكنك حجز حصتك التجريبية الآن بكل سهولة عبر صفحة "حصة تجريبية" واختيار المواعيد بالساعة والسنة واليوم.' : 'You can easily book your trial lesson via the "Trial Lesson" page and choose your slots hour by hour.';
    } else if(lowQ.includes('مقام') || lowQ.includes('maqamat') || lowQ.includes('صوت')) {
      ans = currentLang==='ar' ? 'لدينا مسار متخصص في المقامات الثمانية (بياتي، رست، نهاوند، حجاز، إلخ) مع تدريب عملي وتصحيح مباشر للصوت.' : 'We have a specialized maqamat track with practical training and vocal correction.';
    } else if(lowQ.includes('إجازة') || lowQ.includes('ijaza') || lowQ.includes('سند')) {
      ans = currentLang==='ar' ? 'نقدم إجازات متصلة السند برواية حفص عن عاصم والقراءات العشر مع مشايخ معتمدين.' : 'We offer connected ijazat with Hafs and 10 Qiraat with certified sheikhs.';
    } else {
      // ذكاء اصطناعي لا يعرف الإجابة -> يطلب التواصل البشري Human Handover
      ans = currentLang==='ar' 
        ? `عذراً، لم أتمكن من إيجاد إجابة دقيقة لسؤالك بدقة. يرجى التواصل مباشرة مع أحد معلمي ومشرفي أكاديمية إتقان عبر واتساب وسنجيبك فوراً:<br><a href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('استفسار من البوت: ' + q)}" target="_blank" class="ai-human-btn"><i class="fa-brands fa-whatsapp"></i> تحدث مع مشرف بشري (Human)</a>`
        : `I'm sorry, I couldn't find a precise answer. Please chat directly with our human supervisor on WhatsApp:<br><a href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('Bot inquiry: ' + q)}" target="_blank" class="ai-human-btn"><i class="fa-brands fa-whatsapp"></i> Chat with Human Supervisor</a>`;
    }

    body.innerHTML += `<div class="ai-msg bot">${ans}</div>`;
    body.scrollTop = body.scrollHeight;
  }, 600);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- التوجيه والصفحات ---------- */
let routeState = { page: 'home', param: null };

function navigate(page, param = null) {
  routeState = { page, param };
  window.scrollTo(0, 0);
  route();
}

window.addEventListener('hashchange', () => {
  let hash = window.location.hash.substring(1) || 'home';
  let parts = hash.split('/');
  navigate(parts[0], parts[1] || null);
});

function route() {
  let v = document.getElementById('view');
  let p = routeState.page;
  let param = routeState.param;

  if (p === 'home') renderHome(v);
  else if (p === 'tracks') renderTracks(v);
  else if (p === 'track') renderTrackDetail(v, param);
  else if (p === 'maqamat') renderMaqamat(v);
  else if (p === 'teachers') renderTeachers(v);
  else if (p === 'library') renderLibrary(v);
  else if (p === 'pricing') renderPricing(v);
  else if (p === 'booking') renderBooking(v);
  else if (p === 'about') renderAbout(v);
  else if (p === 'contact') renderContact(v);
  else renderHome(v);
}

/* =====================================================================
    📝 نظام حجز متطور ومطابق تماماً للمطلوب (تاريخ الحصة التجريبية + اختيار 24 ساعة بالساعة واليوم بكل حرية)
   ===================================================================== */
let bookingState = {
  name: '', email: '', phone: '', track: 'ijaza', trialDate: '', trialTime: '', tz: 'Africa/Cairo', who: 'self', notes: '',
  selectedSlots: {} // صيغة التخزين: { dayIndex: [0, 1, ..., 23] }
};

function renderBooking(el) {
  el.innerHTML = `
    <div class="wrap" style="padding-block:3rem">
      <div class="crumb"><a href="#home" onclick="navigate('home')">${t('common.home')}</a> / ${t('bk.title')}</div>
      <h1 class="stitle">${t('bk.title')}</h1>
      <p class="ssub">${t('bk.sub')}</p>

      <div class="card" style="max-width:44rem;margin-inline:auto">
        <form onsubmit="submitBooking(event)">
          <h3 style="margin-bottom:1rem;color:var(--accent)">${t('bk.s1')}</h3>
          <div class="fgrid" style="margin-bottom:1rem">
            <div>
              <label class="l">${t('bk.l.name')}</label>
              <input class="in" type="text" id="bName" value="${bookingState.name}" required>
            </div>
            <div>
              <label class="l">${t('bk.l.email')}</label>
              <input class="in" type="email" id="bEmail" value="${bookingState.email}" required>
            </div>
          </div>
          <div class="fgrid" style="margin-bottom:1rem">
            <div>
              <label class="l">${t('bk.l.phone')}</label>
              <input class="in" type="tel" id="bPhone" value="${bookingState.phone}" required placeholder="010xxxxxxxx">
            </div>
            <div>
              <label class="l">${t('bk.l.track')}</label>
              <select class="in" id="bTrack">
                ${TRACKS.map(tr => `<option value="${tr}" ${bookingState.track===tr?'selected':''}>${I18N[currentLang].tracks[tr].title}</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="fgrid" style="margin-bottom:1.5rem">
            <div>
              <label class="l">${t('bk.l.trial')}</label>
              <input class="in" type="datetime-local" id="bTrial" value="${bookingState.trialDate}" required>
              <small class="muted xs">${currentLang==='ar'?'مثال: الأربعاء 12 يونيو، الساعة 9:00 مساءً':'e.g. Wednesday June 12, 9:00 PM'}</small>
            </div>
            <div>
              <label class="l">${t('bk.l.tz')}</label>
              <input class="in" type="text" id="bTz" value="${bookingState.tz}">
            </div>
          </div>

          <hr style="border:0;border-top:1px solid var(--line);margin:1.5rem 0">

          <h3 style="margin-bottom:.5rem;color:var(--accent)">${t('bk.s2')}</h3>
          <p class="muted sm" style="margin-bottom:1rem">${t('bk.hint')}</p>

          <div style="display:flex;flex-direction:column;gap:1.5rem;margin-bottom:1.5rem">
            ${I18N[currentLang].days.map((dayName, dayIdx) => `
              <fieldset>
                <legend>${dayName}</legend>
                <div class="hour-grid">
                  ${Array.from({length: 24}, (_, hour) => {
                    let isSelected = bookingState.selectedSlots[dayIdx] && bookingState.selectedSlots[dayIdx].includes(hour);
                    let hourLabel = hour < 10 ? `0${hour}:00` : `${hour}:00`;
                    return `
                      <button type="button" class="hourbtn" aria-pressed="${isSelected}" onclick="toggleHourSlot(${dayIdx}, ${hour})">
                        ${hourLabel}
                      </button>
                    `;
                  }).join('')}
                </div>
              </fieldset>
            `).join('')}
          </div>

          <div id="bookingErr" class="err" style="display:none;margin-bottom:1rem"></div>

          <button type="submit" class="btn btn-p btn-full">${t('bk.submit')}</button>
        </form>
      </div>
    </div>
  `;
}

function toggleHourSlot(dayIdx, hour) {
  if(!bookingState.selectedSlots[dayIdx]) {
    bookingState.selectedSlots[dayIdx] = [];
  }
  let idx = bookingState.selectedSlots[dayIdx].indexOf(hour);
  if(idx > -1) {
    bookingState.selectedSlots[dayIdx].splice(idx, 1);
    if(bookingState.selectedSlots[dayIdx].length === 0) {
      delete bookingState.selectedSlots[dayIdx];
    }
  } else {
    bookingState.selectedSlots[dayIdx].push(hour);
    bookingState.selectedSlots[dayIdx].sort((a,b)=>a-b);
  }
  // إعادة رسم الحقول لتحديث الزر المُحدد
  renderBooking(document.getElementById('view'));
  // الحفاظ على المدخلات النصية
  document.getElementById('bName').value = document.getElementById('bName').value;
}

function submitBooking(e) {
  e.preventDefault();
  bookingState.name = document.getElementById('bName').value;
  bookingState.email = document.getElementById('bEmail').value;
  bookingState.phone = document.getElementById('bPhone').value;
  bookingState.track = document.getElementById('bTrack').value;
  bookingState.trialDate = document.getElementById('bTrial').value;
  bookingState.tz = document.getElementById('bTz').value;

  let totalSlots = Object.values(bookingState.selectedSlots).reduce((acc, curr) => acc + curr.length, 0);

  let errBox = document.getElementById('bookingErr');
  if(!bookingState.trialDate) {
    errBox.textContent = I18N[currentLang].bk.err.trial;
    errBox.style.display = 'block';
    return;
  }
  if(totalSlots === 0) {
    errBox.textContent = I18N[currentLang].bk.err.slots;
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';

  // بناء نص رسالة واتساب الشاملة للحجز الدقيق بالساعة واليوم والتاريخ التجريبي
  let slotsSummary = Object.keys(bookingState.selectedSlots).map(dIdx => {
    let dayName = I18N[currentLang].days[dIdx];
    let hours = bookingState.selectedSlots[dIdx].map(h => `${h}:00`).join(', ');
    return `• ${dayName}: الساعات (${hours})`;
  }).join('\n');

  let waText = `طلب حجز جديد في أكاديمية إتقان:
- الاسم: ${bookingState.name}
- البريد: ${bookingState.email}
- الهاتف: ${bookingState.phone}
- المسار: ${I18N[currentLang].tracks[bookingState.track].title}
- موعد الحصة التجريبية المحدد: ${bookingState.trialDate}
- المواعيد الأسبوعية المختارة (الساعة بساعة):
${slotsSummary}
- المنطقة الزمنية: ${bookingState.tz}`;

  let waUrl = `https://wa.me/${CONFIG.whatsapp}?text=` + encodeURIComponent(waText);

  let el = document.getElementById('view');
  el.innerHTML = `
    <div class="wrap" style="padding-block:4rem;text-align:center">
      <div class="card" style="max-width:38rem;margin-inline:auto">
        <h2 class="stitle accent">${I18N[currentLang].bk.ok.title}</h2>
        <p class="muted" style="margin:1rem 0">${I18N[currentLang].bk.ok.descWa}</p>
        <a class="btn btn-p btn-full" style="background:#25d366;color:#fff;margin-top:1rem" href="${waUrl}" target="_blank">
          <i class="fa-brands fa-whatsapp"></i> ${I18N[currentLang].bk.ok.wa}
        </a>
      </div>
    </div>
  `;
}
