   ===================================================================== */
let state = {
  lang: localStorage.getItem('lang') || 'ar',
  theme: localStorage.getItem('theme') || 'dark',
  route: 'home',
  params: null,
  mobileMenu: false,
  booking: { step: 1, track: '', email: '', phone: '', countryCode: '+20', trialDateTime: '', timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Africa/Cairo', who: 'self', notes: '', slots: {} },
  checkout: { planId: '', name: '', email: '', method: 'stripe', terms: false, ref: 'AA-' + Math.floor(100000 + Math.random() * 900000) }
};

function t(path, vars) {
  let lang = I18N[state.lang] ? state.lang : 'ar';
  let keys = path.split('.');
  let val = I18N[lang];
  for (let k of keys) {
    if (val && val[k] !== undefined) val = val[k];
    else {
      // Fallback to Arabic or English
      let fb = I18N['ar'];
      let fval = fb;
      for (let fk of keys) { if (fval && fval[fk] !== undefined) fval = fval[fk]; else { fval = path; break; } }
      val = fval;
      break;
    }
  }
  if (typeof val === 'string' && vars) {
    for (let vk in vars) val = val.replace(`{${vk}}`, vars[vk]);
  }
  return val;
}

function navigate(route, params) {
  state.route = route;
  state.params = params;
  state.mobileMenu = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function setTheme(theme) {
  state.theme = theme;
  localStorage.setItem('theme', theme);
  document.documentElement.setAttribute('data-theme', theme);
  render();
}

function setLang(lang) {
  state.lang = lang;
  localStorage.setItem('lang', lang);
  document.documentElement.setAttribute('dir', I18N[lang]?.dir || 'rtl');
  document.documentElement.setAttribute('lang', lang);
  render();
}

function handleCheckout(e) {
  e.preventDefault();
  let name = document.getElementById('coName').value.trim();
  let email = document.getElementById('coEmail').value.trim();
  let method = document.querySelector('input[name="payMethod"]:checked')?.value || 'whatsapp';
  let terms = document.getElementById('coTerms').checked;
  if (!name || !email || !terms) return alert(t('co.err.terms'));

  state.checkout.name = name;
  state.checkout.email = email;
  state.checkout.method = method;

  let pay = CONFIG.payments;
  let plan = PLANS.find(p=>p.id===state.checkout.planId);
  let planName = t('pr.plans.'+(plan?.id||'pack8')).t;

  if (method==='stripe' && pay.stripeLinks[plan?.id]) {
    window.location.href = pay.stripeLinks[plan.id];
    return;
  }
  if (method==='paypal' && pay.paypalMe) {
    window.location.href = `https://paypal.me/${pay.paypalMe}/${plan?.price}USD`;
    return;
  }

  // Open WhatsApp with payment confirmation
  let text = `السلام عليكم، أرغب في إتمام الاشتراك:%0A- الاسم: ${name}%0A- البريد: ${email}%0A- الباقة: ${planName} ($${plan?.price})%0A- طريقة الدفع: ${method}%0A- رقم الطلب: ${state.checkout.ref}`;
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${text}`, '_blank');
  navigate('home');
  alert(t('co.afterPay'));
}

  st.who = document.getElementById('bkWho').value;
  st.trialDateTime = document.getElementById('bkTrial').value;
  st.notes = document.getElementById('bkNotes').value.trim();
  let consent = document.getElementById('bkConsent').checked;

  if (!st.name || !st.email || !st.phone || !st.trialDateTime || !consent) {
    alert(t('bk.err.consent'));
    return;
  }
  st.step = 2;
  render();
}

function toggleSlot(dayIndex, hour) {
  let key = `${dayIndex}_${hour}`;
  let st = state.booking;
  st.slots[key] = !st.slots[key];
  let el = document.getElementById(`slot_${key}`);
  if (el) el.setAttribute('aria-pressed', st.slots[key] ? 'true' : 'false');
}

function toggleBand(bandKey) {
  // Quick toggle helper for time bands
  let st = state.booking;
  let hoursMap = {
    dawn: ['02:00 AM','04:00 AM'],
    morning: ['08:00 AM','10:00 AM'],
    afternoon: ['02:00 PM','04:00 PM'],
    evening: ['06:00 PM','08:00 PM'],
    night: ['10:00 PM']
  };
  let hours = hoursMap[bandKey] || [];
  for (let d=0; d<7; d++) {
    for (let h of hours) {
      let key = `${d}_${h}`;
      st.slots[key] = !st.slots[key];
      let el = document.getElementById(`slot_${key}`);
      if (el) el.setAttribute('aria-pressed', st.slots[key] ? 'true' : 'false');
    }
  }
}

function submitBooking() {
  let st = state.booking;
  let activeSlots = Object.keys(st.slots).filter(k=>st.slots[k]);
  if (activeSlots.length===0) {
    alert(t('bk.err.slots'));
    return;
  }
  st.step = 3;
  render();
}

function buildWhatsAppText() {
  let st = state.booking;
  let daysNames = I18N[state.lang]?.days || I18N['ar'].days;
  let activeSlots = Object.keys(st.slots).filter(k=>st.slots[k]).map(k=>{
    let [d, h] = k.split('_');
    return `${daysNames[d]} (${h})`;
  });

  return `السلام عليكم، أرغب في حجز حصة تجريبية في أكاديمية الشيخ أحمد:%0A` +
         `- الاسم: ${st.name}%0A` +
         `- البريد: ${st.email}%0A` +
         `- الهاتف: ${st.countryCode} ${st.phone}%0A` +
         `- المسار: ${st.track}%0A` +
         `- موعد الحصة التجريبية: ${st.trialDateTime} (${st.timezone})%0A` +
         `- الفترات الدائمة المفضلة: ${activeSlots.join(', ')}%0A` +
         `- ملاحظات: ${st.notes || 'لا يوجد'}`;
}

  </div>`;
}

/* =====================================================================
   🚀 حلقة التسيير الرئيسية (Render Loop)
   ===================================================================== */
function render() {
  let app = document.getElementById('app');
  if (!app) return;

  let content = '';
  switch (state.route) {
    case 'home': content = viewHome(); break;
    case 'tracks': content = viewTracks(); break;
    case 'track': content = viewTrack(state.params); break;
    case 'maqamat': content = viewMaqamat(); break;
    case 'teachers': content = viewTeachers(); break;
    case 'library': content = viewLibrary(); break;
    case 'pricing': content = viewPricing(); break;
    case 'checkout': content = viewCheckout(); break;
    case 'booking': content = viewBooking(); break;
    case 'about': content = viewAbout(); break;
    case 'contact': content = viewContact(); break;
    default: content = viewHome();
  }

  app.innerHTML = renderHeader() + `<main id="main" tabindex="-1">${content}</main>` + renderFooter();
}

// تشغيل التطبيق أول مرة
document.addEventListener('DOMContentLoaded', () => {
  document.documentElement.setAttribute('dir', I18N[state.lang]?.dir || 'rtl');
  document.documentElement.setAttribute('lang', state.lang);
  document.documentElement.setAttribute('data-theme', state.theme);
  render();
});
</script>
</body>
</html>
