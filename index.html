.logo{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.logo i{font-style:normal;display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:1.2rem}
.logo b{display:block;color:var(--accent);font-size:.95rem;line-height:1.2}
.logo small{display:none;color:var(--muted);font-size:.7rem}
.nav{display:none;gap:.15rem}
.nav a{white-space:nowrap;padding:.45rem .6rem;border-radius:10px;text-decoration:none;font-weight:700;font-size:.88rem}
.nav a:hover,.nav a[aria-current=page]{color:var(--accent)}
.tools{display:flex;align-items:center;gap:.4rem}
.ibtn{display:inline-flex;align-items:center;justify-content:center;height:36px;min-width:36px;padding-inline:.6rem;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font:inherit;font-size:.85rem;font-weight:700}
.ibtn:hover{border-color:var(--accent)}

.mnav{display:none;border-top:1px solid var(--line);background:var(--card)}

.mnav a{display:block;padding:.7rem .5rem;border-radius:10px;text-decoration:none;font-weight:700}
.mnav a:hover{background:var(--bg)}
.btn.hide-sm{display:none;white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:12px;padding:.65rem 1.25rem;font:inherit;font-weight:700;font-size:.92rem;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:.15s;text-align:center}
.btn:hover{opacity:.9}
.btn[disabled],.btn[aria-disabled=true]{opacity:.55;cursor:not-allowed}
.btn-p{background:var(--accent);color:var(--accent-fg)}
.btn-g{background:var(--gold);color:var(--gold-fg)}

.sec{padding-block:3rem}
.sec-alt{background:var(--card);border-block:1px solid var(--line)}
.stitle{font-size:1.6rem;font-weight:800;margin-bottom:.5rem}
.ssub{color:var(--muted);max-width:42rem;margin-bottom:1.75rem}

.card-h:hover{border-color:var(--accent)}

.badge-g{border-color:color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}

.hero p.lead{font-size:1.05rem;color:var(--muted);max-width:40rem}
.row{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
.checks li{display:flex;gap:.5rem}
.checks li:before{content:"✓";color:var(--accent);font-weight:800}

@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}

let currentLang = localStorage.getItem('lang') || 'ar';
let currentTheme = localStorage.getItem('theme') || 'dark';

function t(key, vars = {}) {
  let keys = key.split('.');
  let val = I18N[currentLang];
  for (let k of keys) {
    if (val && val[k] !== undefined) val = val[k];
    else {
      val = I18N['ar'];
      for (let k2 of keys) { if (val) val = val[k2]; }
      break;
    }
  }
  if (typeof val !== 'string') return key;
  for (let v in vars) { val = val.replace(new RegExp(`\\{${v}\\}`, 'g'), vars[v]); }
  return val;
}

/* محرك ذكاء اصطناعي تفاعلي مع دعم التحويل البشري عند العجز */
function sendAIQuery() {
  const input = document.getElementById('aiInput');
  const body = document.getElementById('aiBody');
  const q = input.value.trim();
  if(!q) return;

  body.innerHTML += `<div class="ai-msg user">${escapeHtml(q)}</div>`;
  input.value = '';
  body.scrollTop = body.scrollHeight;

  setTimeout(() => {
    let ans = "";
    let lowQ = q.toLowerCase();
    
    if(lowQ.includes('سعر') || lowQ.includes('تكلفة') || lowQ.includes('price') || lowQ.includes('cost') || lowQ.includes('价格')) {
      ans = currentLang==='ar' ? 'تبدأ الباقات من 40$ شهرياً، وتتوفر حصة تجريبية للتعرف على مستواك. يمكنك زيارة صفحة الأسعار للتفاصيل.' : 'Packages start from $40/month, and a trial lesson is available. Check the pricing page for details.';
    } else if(lowQ.includes('حجز') || lowQ.includes('تجريبية') || lowQ.includes('book') || lowQ.includes('trial') || lowQ.includes('预约')) {
      ans = currentLang==='ar' ? 'يمكنك حجز حصتك التجريبية الآن بكل سهولة عبر صفحة "حصة تجريبية" واختيار المواعيد بالساعة والسنة واليوم.' : 'You can easily book your trial lesson via the "Trial Lesson" page and choose your slots hour by hour.';
    } else if(lowQ.includes('مقام') || lowQ.includes('maqamat') || lowQ.includes('صوت') || lowQ.includes('音调')) {
      ans = currentLang==='ar' ? 'لدينا مسار متخصص في المقامات الثمانية (بياتي، رست، نهاوند، حجاز، إلخ) مع تدريب عملي وتصحيح مباشر للصوت.' : 'We have a specialized maqamat track with practical training and vocal correction.';
    } else if(lowQ.includes('إجازة') || lowQ.includes('ijaza') || lowQ.includes('سند') || lowQ.includes('传承')) {
      ans = currentLang==='ar' ? 'نقدم إجازات متصلة السند برواية حفص عن عاصم والقراءات العشر مع مشايخ معتمدين.' : 'We offer connected ijazat with Hafs and 10 Qiraat with certified sheikhs.';
    } else {
      ans = currentLang==='ar' 
        ? `عذراً، لم أتمكن من إيجاد إجابة دقيقة لسؤالك. يرجى التواصل مباشرة مع مشرفي أكاديمية إتقان عبر واتساب وسنجيبك فوراً:<br><a href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('استفسار من البوت: ' + q)}" target="_blank" class="ai-human-btn"><i class="fa-brands fa-whatsapp"></i> تحدث مع مشرف بشري (Human)</a>`
        : `I'm sorry, I couldn't find a precise answer. Please chat directly with our human supervisor on WhatsApp:<br><a href="https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent('Bot inquiry: ' + q)}" target="_blank" class="ai-human-btn"><i class="fa-brands fa-whatsapp"></i> Chat with Human Supervisor</a>`;
    }

    body.innerHTML += `<div class="ai-msg bot">${ans}</div>`;
    body.scrollTop = body.scrollHeight;
  }, 600);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* ---------- التوجيه والصفحات ---------- */
let routeState = { page: 'home', param: null };

function navigate(page, param = null) {
  routeState = { page, param };
  window.scrollTo(0, 0);
  route();
}

window.addEventListener('hashchange', () => {
  let hash = window.location.hash.substring(1) || 'home';
  let parts = hash.split('/');
  navigate(parts[0], parts[1] || null);
});

function route() {
  let v = document.getElementById('view');
  let p = routeState.page;
  let param = routeState.param;

  if (p === 'home') renderHome(v);
  else if (p === 'tracks') renderTracks(v);
  else if (p === 'track') renderTrackDetail(v, param);
  else if (p === 'maqamat') renderMaqamat(v);
  else if (p === 'teachers') renderTeachers(v);
  else if (p === 'library') renderLibrary(v);
  else if (p === 'pricing') renderPricing(v);
  else if (p === 'booking') renderBooking(v);
  else if (p === 'about') renderAbout(v);
  else if (p === 'contact') renderContact(v);
  else renderHome(v);
}

              <fieldset>
                <legend>${dayName}</legend>
                <div class="hour-grid">
                  ${Array.from({length: 24}, (_, hour) => {
                    let isSelected = bookingState.selectedSlots[dayIdx] && bookingState.selectedSlots[dayIdx].includes(hour);
                    let hourLabel = hour < 10 ? `0${hour}:00` : `${hour}:00`;
                    return `
                      <button type="button" class="hourbtn" aria-pressed="${isSelected}" onclick="toggleHourSlot(${dayIdx}, ${hour})">
                        ${hourLabel}
                      </button>
                    `;
                  }).join('')}
                </div>
              </fieldset>
            `).join('')}
          </div>

          <div id="bookingErr" class="err" style="display:none;margin-bottom:1rem"></div>

          <button type="submit" class="btn btn-p btn-full">${t('bk.submit')}</button>

  `;
}

function toggleHourSlot(dayIdx, hour) {
  if(!bookingState.selectedSlots[dayIdx]) {
    bookingState.selectedSlots[dayIdx] = [];
  }
  let idx = bookingState.selectedSlots[dayIdx].indexOf(hour);
  if(idx > -1) {
    bookingState.selectedSlots[dayIdx].splice(idx, 1);
    if(bookingState.selectedSlots[dayIdx].length === 0) {
      delete bookingState.selectedSlots[dayIdx];
    }
  } else {
    bookingState.selectedSlots[dayIdx].push(hour);
    bookingState.selectedSlots[dayIdx].sort((a,b)=>a-b);
  }
  renderBooking(document.getElementById('view'));
  document.getElementById('bName').value = document.getElementById('bName').value;
}

function submitBooking(e) {
  e.preventDefault();
  bookingState.name = document.getElementById('bName').value;
  bookingState.email = document.getElementById('bEmail').value;
  bookingState.phone = document.getElementById('bPhone').value;
  bookingState.track = document.getElementById('bTrack').value;
  bookingState.trialDate = document.getElementById('bTrial').value;
  bookingState.tz = document.getElementById('bTz').value;

  let totalSlots = Object.values(bookingState.selectedSlots).reduce((acc, curr) => acc + curr.length, 0);

  let errBox = document.getElementById('bookingErr');
  if(!bookingState.trialDate) {
    errBox.textContent = I18N[currentLang].bk.err.trial;
    errBox.style.display = 'block';
    return;
  }
  if(totalSlots === 0) {
    errBox.textContent = I18N[currentLang].bk.err.slots;
    errBox.style.display = 'block';
    return;
  }
  errBox.style.display = 'none';

  let slotsSummary = Object.keys(bookingState.selectedSlots).map(dIdx => {
    let dayName = I18N[currentLang].days[dIdx];
    let hours = bookingState.selectedSlots[dIdx].map(h => `${h}:00`).join(', ');
    let dayLabel = (currentLang==='ar') ? `• ${dayName}: الساعات (${hours})` : `• ${dayName}: Hours (${hours})`;
    return dayLabel;
  }).join('\n');

  let waText = `طلب حجز جديد في أكاديمية إتقان:
- الاسم: ${bookingState.name}
- البريد: ${bookingState.email}
- الهاتف: ${bookingState.phone}
- المسار: ${I18N[currentLang].tracks[bookingState.track].title}
- موعد الحصة التجريبية المختار: ${bookingState.trialDate}
- المواعيد الأسبوعية المختارة (الساعة بساعة):
